# cargo-about: the Rust half of the third-party notices shipped in the app
# (`node scripts/notices.mjs`, run by `npm run build:release`). Same allow-list as deny.toml.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
