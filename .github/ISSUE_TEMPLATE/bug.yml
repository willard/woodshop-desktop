name: Bug report
description: Something in Woodshop doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Settings ▸ Diagnostics ▸ Report a problem fills in the version and system for you.
        Security problems go to [a private report](https://github.com/willard/woodshop-desktop/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1. Open the "Bookcase" template
        2. ...
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Woodshop version
      description: Settings ▸ Updates shows it.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.4, Windows 11, Ubuntu 24.04…
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: >-
        If you can, attach the `.woodshop` file that shows the problem (Export… on the project) and the log file
        (Settings ▸ Diagnostics ▸ Show log files). Both stay private until you attach them here, and anyone can see them afterwards.
    validations:
      required: false
