[workspace]
resolver = "3"
members = ["crates/woodshop-core", "crates/woodshop-wasm", "crates/woodshop-store", "crates/woodshop-export", "crates/woodshop-mcp", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
woodshop-core = { path = "crates/woodshop-core", default-features = false }
woodshop-store = { path = "crates/woodshop-store" }
woodshop-export = { path = "crates/woodshop-export" }
woodshop-mcp = { path = "crates/woodshop-mcp" }

# Debug builds keep only file and line numbers for our own crates (enough for a readable
# backtrace) and no debug info for dependencies. Full DWARF, for Typst, Tauri and rmcp and then
# for our crates too, is copied into every test binary: it put 20+ GB in target/debug and slowed
# every link. Set `debug = true` locally if you need a debugger to show variables.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true

# The webview downloads nothing, but a smaller module still parses and instantiates faster.
[profile.release.package.woodshop-wasm]
opt-level = "z"
