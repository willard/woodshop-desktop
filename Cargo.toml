[workspace]
resolver = "3"
members = ["crates/woodshop-core", "crates/woodshop-wasm", "crates/woodshop-store", "crates/woodshop-export", "crates/woodshop-mcp", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
woodshop-core = { path = "crates/woodshop-core", default-features = false }
woodshop-store = { path = "crates/woodshop-store" }
woodshop-export = { path = "crates/woodshop-export" }
woodshop-mcp = { path = "crates/woodshop-mcp" }

# Debug builds keep full debug info for our own crates only. Typst, Tauri and rmcp with full DWARF
# put tens of gigabytes in target/ (copied into every test binary) and slowed every link.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true

# The webview downloads nothing, but a smaller module still parses and instantiates faster.
[profile.release.package.woodshop-wasm]
opt-level = "z"
